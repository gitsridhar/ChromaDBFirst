[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-ollama"
version = "0.1.0"
description = "Local agentic RAG app with Ollama, PDF ingestion, and ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.5",
  "pypdf>=4.2.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
